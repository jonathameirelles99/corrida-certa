name: CorridaCerta
options:
  bundleIdPrefix: com.corridacerta
  deploymentTarget:
    iOS: "16.6"

targets:
  CorridaCerta:
    type: application
    platform: iOS
    sources:
      - path: CorridaCerta
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corridacerta.app
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: CorridaCerta/CorridaCerta.entitlements
    info:
      path: CorridaCerta/Info.plist
    dependencies:
      - target: CorridaCertaBroadcast
        embed: true

  CorridaCertaBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: CorridaCertaBroadcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corridacerta.app.broadcast
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: CorridaCertaBroadcast/CorridaCertaBroadcast.entitlements
    info:
      path: CorridaCertaBroadcast/Info.plist

  CorridaCertaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CorridaCertaTests
    dependencies:
      - target: CorridaCerta
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  CorridaCerta:
    build:
      targets:
        CorridaCerta: all
        CorridaCertaBroadcast: all
        CorridaCertaTests: [test]
    test:
      targets:
        - CorridaCertaTests
