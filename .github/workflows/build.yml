name: Build e Testes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Instalar xcpretty (logs mais legíveis)
        run: gem install xcpretty

      - name: Gerar o projeto Xcode (.xcodeproj)
        run: xcodegen generate

      - name: Selecionar versão do Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Compilar o app (iOS Simulator)
        run: |
          xcodebuild build \
            -project CorridaCerta.xcodeproj \
            -scheme CorridaCerta \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Rodar os testes unitários
        run: |
          xcodebuild test \
            -project CorridaCerta.xcodeproj \
            -scheme CorridaCerta \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            | xcpretty && exit ${PIPESTATUS[0]}
