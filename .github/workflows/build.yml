name: Build e Testes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Instalar xcpretty (logs mais legíveis)
        run: gem install xcpretty

      - name: Gerar o projeto Xcode (.xcodeproj)
        run: xcodegen generate

      - name: Selecionar versão do Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Detectar um simulador de iPhone disponível
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available \
            | grep -m1 "iPhone" \
            | sed -E 's/^ *([^(]+) \(.*/\1/' \
            | xargs)
          echo "Simulador escolhido: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Compilar o app (iOS Simulator)
        run: |
          xcodebuild build \
            -project CorridaCerta.xcodeproj \
            -scheme CorridaCerta \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.name }}' \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Compilar os testes (sem instalar no simulador)
        run: |
          xcodebuild build-for-testing \
            -project CorridaCerta.xcodeproj \
            -scheme CorridaCerta \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.name }}' \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Criar certificado de assinatura local
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=temporaria123
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          EXISTING=$(security list-keychains -d user | sed 's/"//g')
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING

          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 3650 -nodes \
            -subj "/CN=CorridaCerta Local Signing" \
            -addext "keyUsage=critical,digitalSignature" \
            -addext "extendedKeyUsage=codeSigning"

          openssl pkcs12 -export -out cert.p12 -inkey key.pem -in cert.pem -passout pass:"$KEYCHAIN_PASSWORD"

          security import cert.p12 -k "$KEYCHAIN" -P "$KEYCHAIN_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Gerar arquivo .xcarchive (certificado local, para dispositivo real)
        run: |
          xcodebuild archive \
            -project CorridaCerta.xcodeproj \
            -scheme CorridaCerta \
            -archivePath build/CorridaCerta.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="CorridaCerta Local Signing" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Reassinar com as entitlements reais (sem exigir provisioning profile)
        run: |
          APP_PATH="build/CorridaCerta.xcarchive/Products/Applications/CorridaCerta.app"
          EXT_PATH="$APP_PATH/PlugIns/CorridaCertaBroadcast.appex"

          codesign --force --sign "CorridaCerta Local Signing" \
            --entitlements CorridaCertaBroadcast/CorridaCertaBroadcast.entitlements \
            "$EXT_PATH"

          codesign --force --sign "CorridaCerta Local Signing" \
            --entitlements CorridaCerta/CorridaCerta.entitlements \
            "$APP_PATH"

          echo "--- Verificando assinatura final ---"
          codesign -dv --entitlements - "$APP_PATH"

      - name: Conferir se o .app e a extensão foram gerados corretamente
        run: |
          APP_PATH="build/CorridaCerta.xcarchive/Products/Applications/CorridaCerta.app"
          echo "--- Conteúdo do .xcarchive ---"
          find build/CorridaCerta.xcarchive -maxdepth 4
          echo "--- Tamanho do .app ---"
          du -sh "$APP_PATH"
          echo "--- Verificando binário principal ---"
          BIN_PATH="$APP_PATH/CorridaCerta"
          if [ ! -f "$BIN_PATH" ]; then
            echo "ERRO: binário principal não encontrado em $BIN_PATH"
            exit 1
          fi
          file "$BIN_PATH"
          echo "--- Verificando extensão embutida ---"
          EXT_PATH="$APP_PATH/PlugIns/CorridaCertaBroadcast.appex"
          if [ ! -d "$EXT_PATH" ]; then
