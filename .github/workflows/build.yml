name: Build e Testes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Instalar xcpretty (logs mais legíveis)
        run: gem install xcpretty

      - name: Gerar o projeto Xcode (.xcodeproj)
        run: xcodegen generate

      - name: Selecionar versão do Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Detectar um simulador de iPhone disponível
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available \
            | grep -m1 "iPhone" \
            | sed -E 's/^ *([^(]+) \(.*/\1/' \
            | xargs)
          echo "Simulador escolhido: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Compilar o app (iOS Simulator)
        run: |
          xcodebuild build \
            -project CorridaCerta.xcodeproj \
            -scheme CorridaCerta \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.name }}' \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Compilar os testes (sem instalar no simulador)
        run: |
          xcodebuild build-for-testing \
            -project CorridaCerta.xcodeproj \
            -scheme CorridaCerta \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.name }}' \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Gerar arquivo .xcarchive (assinatura ad-hoc, para dispositivo real)
        run: |
          xcodebuild archive \
            -project CorridaCerta.xcodeproj \
            -scheme CorridaCerta \
            -archivePath build/CorridaCerta.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Conferir se o .app e a extensão foram gerados corretamente
        run: |
          APP_PATH="build/CorridaCerta.xcarchive/Products/Applications/CorridaCerta.app"
          echo "--- Conteúdo do .xcarchive ---"
          find build/CorridaCerta.xcarchive -maxdepth 4
          echo "--- Tamanho do .app ---"
          du -sh "$APP_PATH"
          echo "--- Verificando binário principal ---"
          BIN_PATH="$APP_PATH/CorridaCerta"
          if [ ! -f "$BIN_PATH" ]; then
            echo "ERRO: binário principal não encontrado em $BIN_PATH"
            exit 1
          fi
          file "$BIN_PATH"
          echo "--- Verificando extensão embutida ---"
          EXT_PATH="$APP_PATH/PlugIns/CorridaCertaBroadcast.appex"
          if [ ! -d "$EXT_PATH" ]; then
            echo "ERRO: extensão CorridaCertaBroadcast.appex não foi embutida em $EXT_PATH"
            exit 1
          fi
          du -sh "$EXT_PATH"

      - name: Empacotar como .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/CorridaCerta.xcarchive/Products/Applications/CorridaCerta.app build/Payload/
          cd build
          zip -r CorridaCerta.ipa Payload
          cd ..
          echo "--- Tamanho final do .ipa ---"
          du -sh build/CorridaCerta.ipa
          ls -la build/CorridaCerta.ipa

      - name: Disponibilizar o .ipa para download
        uses: actions/upload-artifact@v4
        with:
          name: CorridaCerta-ipa
          path: build/CorridaCerta.ipa
          retention-days: 14
