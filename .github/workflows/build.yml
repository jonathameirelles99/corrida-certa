name: Build e Testes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Instalar xcpretty (logs mais legíveis)
        run: gem install xcpretty

      - name: Gerar o projeto Xcode (.xcodeproj)
        run: xcodegen generate

      - name: Selecionar versão do Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Detectar um simulador de iPhone disponível
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available \
            | grep -m1 "iPhone" \
            | sed -E 's/^ *([^(]+) \(.*/\1/' \
            | xargs)
          echo "Simulador escolhido: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Compilar o app (iOS Simulator)
        run: |
          xcodebuild build \
            -project CorridaCerta.xcodeproj \
            -scheme CorridaCerta \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.name }}' \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Compilar os testes (sem instalar no simulador)
        run: |
          xcodebuild build-for-testing \
            -project CorridaCerta.xcodeproj \
            -scheme CorridaCerta \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.name }}' \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Gerar IPA
  run: |
    xcodebuild \
      -project CorridaCerta.xcodeproj \
      -scheme CorridaCerta \
      -archivePath build/CorridaCerta.xcarchive \
      -destination 'generic/platform=iOS' \
      archive \
      CODE_SIGNING_ALLOWED=NO \
      CODE_SIGNING_REQUIRED=NO

    mkdir -p build/export

    xcodebuild \
      -exportArchive \
      -archivePath build/CorridaCerta.xcarchive \
      -exportPath build/export \
      -exportOptionsPlist ExportOptions.plist

    cp build/export/*.ipa build/CorridaCerta.ipa

      - name: Disponibilizar o .ipa para download
        uses: actions/upload-artifact@v4
        with:
          name: CorridaCerta-ipa
          path: build/CorridaCerta.ipa
          retention-days: 14
